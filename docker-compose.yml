services:
  app:
    image: golang:1.27-alpine
    container_name: myapp-dev
    working_dir: /app
    volumes:
      - .:/app                        # исходники с хоста
      - go-mod-cache:/go/pkg/mod      # кэш зависимостей (чтобы не качать каждый раз)
      - go-build-cache:/root/.cache/go-build  # кэш сборки
    ports:
      - "8080:8080"
    environment:
      - CGO_ENABLED=0
      - GOOS=linux
    command: go run ./cmd/server/main.go

volumes:
  go-mod-cache:
  go-build-cache: