services:
  app:
    image: golang:1.27-alpine
    container_name: myapp-dev
    working_dir: /app
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - .env
    environment:
      - CGO_ENABLED=0
      - GOOS=linux
    command: sh -c "apk add --no-cache ca-certificates && tail -f /dev/null"
    stdin_open: true
    tty: true

volumes:
  go-mod-cache:
  go-build-cache: